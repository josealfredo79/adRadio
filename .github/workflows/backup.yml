name: Database Backup

# Daily external backup of the production Neon Postgres database.
# Runs pg_dump against PROD_DATABASE_URL and stores the dump as a GitHub
# Actions artifact — an independent copy outside of Neon/Railway, in case
# either account is ever compromised or deleted.
#
# 08:00 UTC ≈ 02:00 America/Mexico_City, a low-traffic time for the app.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify PROD_DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret is not set. Add it under Settings > Secrets and variables > Actions before this workflow can run."
            exit 1
          fi

      # The production DB runs Postgres 16 (see pgvector/pgvector:pg16 in
      # .github/workflows/ci.yml), so pg_dump must match that major version.
      - name: Install PostgreSQL 16 client tools
        run: |
          if sudo apt-get update && sudo apt-get install -y postgresql-client-16; then
            echo "Installed postgresql-client-16 from default repos."
          else
            echo "postgresql-client-16 not available from default repos; adding the PGDG apt repo."
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          pg_dump --version

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_OUT_DIR: ${{ runner.temp }}/backups
        run: |
          chmod +x backend/scripts/backup_db.sh
          backend/scripts/backup_db.sh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: iaradio-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backups/iaradio_backup_*.dump
          retention-days: 30
          if-no-files-found: error
